<!DOCTYPE html>
<html lang="en" data-surface="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Board Gallery — Moddable Rules</title>
<meta name="description" content="Browse board diagrams for every game variant. Filter by family and topology, search, and download SVG or PNG.">
<meta name="theme-color" content="#08080a">
<link rel="stylesheet" href="../css/boards.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a href="../" class="header-brand">Moddable Rules</a>
    <nav class="header-nav">
      <a href="../" class="nav-link">Games</a>
      <a href="./" class="nav-link nav-link--active">Diagrams</a>
      <a href="../api/" class="nav-link">API</a>
      <button class="surface-toggle" aria-label="Toggle light/dark mode" type="button">&#x25D0;</button>
    </nav>
  </div>
</header>

<section class="gallery-hero">
  <div class="hero-eyebrow">Board Gallery</div>
  <h1 class="hero-title">Every board. Every variant.</h1>
  <p class="hero-lede" id="gallery-intro">Loading...</p>
</section>

<section class="gallery-controls">
  <div class="controls-inner">
    <div class="control-row">
      <label class="control-group">
        <span class="control-label">Search</span>
        <input type="text" id="search-input" placeholder="chess, hex, mancala...">
      </label>
      <label class="control-group">
        <span class="control-label">Family</span>
        <select id="family-filter">
          <option value="all">All families</option>
        </select>
      </label>
      <label class="control-group">
        <span class="control-label">Topology</span>
        <select id="topology-filter">
          <option value="all">All topologies</option>
        </select>
      </label>
      <label class="control-group">
        <span class="control-label">Status</span>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="rendered">Rendered</option>
          <option value="missing">Missing</option>
        </select>
      </label>
      <label class="control-group">
        <span class="control-label">Size</span>
        <select id="size-select">
          <option value="160">Small</option>
          <option value="240" selected>Medium</option>
          <option value="360">Large</option>
          <option value="full">Full</option>
        </select>
      </label>
    </div>
    <div class="gallery-stats" id="gallery-stats"></div>
  </div>
</section>

<section class="gallery-body">
  <div class="gallery-container" id="gallery-container"></div>
</section>

<footer class="site-footer">
  <div class="site-footer-inner">
    <div class="footer-columns">
      <div class="footer-col">
        <h4 class="footer-heading">Moddable Games</h4>
        <a href="https://moddable.games" target="_blank" rel="noopener">Homepage</a>
        <a href="https://moddable.games/about/" target="_blank" rel="noopener">About</a>
        <a href="https://moddable.games/news/" target="_blank" rel="noopener">News</a>
        <a href="https://moddable.games/about/roadmap/" target="_blank" rel="noopener">Roadmap</a>
      </div>
      <div class="footer-col">
        <h4 class="footer-heading">Play</h4>
        <a href="https://moddable.games/games/" target="_blank" rel="noopener">Games</a>
        <a href="https://moddable.games/engines/" target="_blank" rel="noopener">Engines</a>
        <a href="https://tools.moddable.games" target="_blank" rel="noopener">Tools</a>
        <a href="https://moddable.games/developers/" target="_blank" rel="noopener">Developers</a>
      </div>
      <div class="footer-col">
        <h4 class="footer-heading">Community</h4>
        <a href="https://moddable.games/community/" target="_blank" rel="noopener">Community</a>
        <a href="https://discord.gg/VhsVGNq6Za" target="_blank" rel="noopener">Discord</a>
        <a href="https://github.com/Moddable-Games" target="_blank" rel="noopener">GitHub</a>
        <a href="https://moddable.games/submit/" target="_blank" rel="noopener">Submit a Mod</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2012&ndash;2026 Moddable Games. All Rights Reserved.</span>
      <span class="footer-version">v1.4.0</span>
    </div>
  </div>
</footer>

<script src="../js/boards.js"></script>
<script src="../shared/js/surface-toggle.js"></script>
</body>
</html>
