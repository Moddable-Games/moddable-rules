<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <title>Alquerque — starting position</title>

  <defs>
    <symbol id="man-dark" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="14" fill="#333" stroke="#111" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="9" fill="none" stroke="#555" stroke-width="1"/>
    </symbol>
    <symbol id="man-light" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="14" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="9" fill="none" stroke="#ccc" stroke-width="1"/>
    </symbol>
  </defs>

  <!-- Board background -->
  <rect x="20" y="20" width="240" height="240" fill="#f5ead0" stroke="#b58863" stroke-width="2"/>

  <!-- Grid lines: orthogonal -->
  <g stroke="#b58863" stroke-width="1.5">
    <!-- Verticals -->
    <line x1="80" y1="20" x2="80" y2="260"/>
    <line x1="140" y1="20" x2="140" y2="260"/>
    <line x1="200" y1="20" x2="200" y2="260"/>
    <!-- Horizontals -->
    <line x1="20" y1="80" x2="260" y2="80"/>
    <line x1="20" y1="140" x2="260" y2="140"/>
    <line x1="20" y1="200" x2="260" y2="200"/>
  </g>

  <!-- Grid lines: diagonals -->
  <g stroke="#b58863" stroke-width="1.2">
    <!-- Main diagonals -->
    <line x1="20" y1="20" x2="260" y2="260"/>
    <line x1="260" y1="20" x2="20" y2="260"/>
    <!-- Half diagonals top-left quadrant -->
    <line x1="20" y1="140" x2="140" y2="20"/>
    <line x1="140" y1="20" x2="260" y2="140"/>
    <!-- Half diagonals bottom-right quadrant -->
    <line x1="20" y1="140" x2="140" y2="260"/>
    <line x1="140" y1="260" x2="260" y2="140"/>
  </g>

  <!-- Intersection dots (for clarity) -->
  <g fill="#b58863">
    <circle cx="20" cy="20" r="3"/>
    <circle cx="80" cy="20" r="3"/>
    <circle cx="140" cy="20" r="3"/>
    <circle cx="200" cy="20" r="3"/>
    <circle cx="260" cy="20" r="3"/>
    <circle cx="20" cy="80" r="3"/>
    <circle cx="80" cy="80" r="3"/>
    <circle cx="140" cy="80" r="3"/>
    <circle cx="200" cy="80" r="3"/>
    <circle cx="260" cy="80" r="3"/>
    <circle cx="20" cy="140" r="3"/>
    <circle cx="80" cy="140" r="3"/>
    <circle cx="140" cy="140" r="3"/>
    <circle cx="200" cy="140" r="3"/>
    <circle cx="260" cy="140" r="3"/>
    <circle cx="20" cy="200" r="3"/>
    <circle cx="80" cy="200" r="3"/>
    <circle cx="140" cy="200" r="3"/>
    <circle cx="200" cy="200" r="3"/>
    <circle cx="260" cy="200" r="3"/>
    <circle cx="20" cy="260" r="3"/>
    <circle cx="80" cy="260" r="3"/>
    <circle cx="140" cy="260" r="3"/>
    <circle cx="200" cy="260" r="3"/>
    <circle cx="260" cy="260" r="3"/>
  </g>

  <!-- Dark pieces: rows 1-2 full (10) + row 3 left 2 (total 12) -->
  <g id="dark-pieces">
    <!-- Row 1 -->
    <use href="#man-dark" x="2" y="2" width="36" height="36"/>
    <use href="#man-dark" x="62" y="2" width="36" height="36"/>
    <use href="#man-dark" x="122" y="2" width="36" height="36"/>
    <use href="#man-dark" x="182" y="2" width="36" height="36"/>
    <use href="#man-dark" x="242" y="2" width="36" height="36"/>
    <!-- Row 2 -->
    <use href="#man-dark" x="2" y="62" width="36" height="36"/>
    <use href="#man-dark" x="62" y="62" width="36" height="36"/>
    <use href="#man-dark" x="122" y="62" width="36" height="36"/>
    <use href="#man-dark" x="182" y="62" width="36" height="36"/>
    <use href="#man-dark" x="242" y="62" width="36" height="36"/>
    <!-- Row 3: left 2 points only -->
    <use href="#man-dark" x="2" y="122" width="36" height="36"/>
    <use href="#man-dark" x="62" y="122" width="36" height="36"/>
  </g>

  <!-- Light pieces: rows 4-5 full (10) + row 3 right 2 (total 12) -->
  <g id="light-pieces">
    <!-- Row 3: right 2 points -->
    <use href="#man-light" x="182" y="122" width="36" height="36"/>
    <use href="#man-light" x="242" y="122" width="36" height="36"/>
    <!-- Row 4 -->
    <use href="#man-light" x="2" y="182" width="36" height="36"/>
    <use href="#man-light" x="62" y="182" width="36" height="36"/>
    <use href="#man-light" x="122" y="182" width="36" height="36"/>
    <use href="#man-light" x="182" y="182" width="36" height="36"/>
    <use href="#man-light" x="242" y="182" width="36" height="36"/>
    <!-- Row 5 -->
    <use href="#man-light" x="2" y="242" width="36" height="36"/>
    <use href="#man-light" x="62" y="242" width="36" height="36"/>
    <use href="#man-light" x="122" y="242" width="36" height="36"/>
    <use href="#man-light" x="182" y="242" width="36" height="36"/>
    <use href="#man-light" x="242" y="242" width="36" height="36"/>
  </g>
</svg>
