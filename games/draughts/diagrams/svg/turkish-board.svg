<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360">
  <title>Turkish Draughts — starting position</title>

  <defs>
    <symbol id="man-dark" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="14" fill="#333" stroke="#111" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="9" fill="none" stroke="#555" stroke-width="1"/>
    </symbol>
    <symbol id="man-light" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="14" fill="#fff" stroke="#333" stroke-width="1.5"/>
      <circle cx="18" cy="18" r="9" fill="none" stroke="#ccc" stroke-width="1"/>
    </symbol>
  </defs>

  <!-- Mono-colour board with grid lines -->
  <g id="board">
    <rect x="20" y="20" width="320" height="320" fill="#e8d4a0"/>
    <g stroke="#b58863" stroke-width="1">
      <line x1="60" y1="20" x2="60" y2="340"/>
      <line x1="100" y1="20" x2="100" y2="340"/>
      <line x1="140" y1="20" x2="140" y2="340"/>
      <line x1="180" y1="20" x2="180" y2="340"/>
      <line x1="220" y1="20" x2="220" y2="340"/>
      <line x1="260" y1="20" x2="260" y2="340"/>
      <line x1="300" y1="20" x2="300" y2="340"/>
      <line x1="20" y1="60" x2="340" y2="60"/>
      <line x1="20" y1="100" x2="340" y2="100"/>
      <line x1="20" y1="140" x2="340" y2="140"/>
      <line x1="20" y1="180" x2="340" y2="180"/>
      <line x1="20" y1="220" x2="340" y2="220"/>
      <line x1="20" y1="260" x2="340" y2="260"/>
      <line x1="20" y1="300" x2="340" y2="300"/>
    </g>
    <rect x="20" y="20" width="320" height="320" fill="none" stroke="#b58863" stroke-width="2"/>
  </g>

  <!-- Dark pieces: rows 2-3 (all 8 squares per row) -->
  <g id="dark-pieces">
    <!-- Row 2 (y=60) -->
    <use href="#man-dark" x="22" y="62" width="36" height="36"/>
    <use href="#man-dark" x="62" y="62" width="36" height="36"/>
    <use href="#man-dark" x="102" y="62" width="36" height="36"/>
    <use href="#man-dark" x="142" y="62" width="36" height="36"/>
    <use href="#man-dark" x="182" y="62" width="36" height="36"/>
    <use href="#man-dark" x="222" y="62" width="36" height="36"/>
    <use href="#man-dark" x="262" y="62" width="36" height="36"/>
    <use href="#man-dark" x="302" y="62" width="36" height="36"/>
    <!-- Row 3 (y=100) -->
    <use href="#man-dark" x="22" y="102" width="36" height="36"/>
    <use href="#man-dark" x="62" y="102" width="36" height="36"/>
    <use href="#man-dark" x="102" y="102" width="36" height="36"/>
    <use href="#man-dark" x="142" y="102" width="36" height="36"/>
    <use href="#man-dark" x="182" y="102" width="36" height="36"/>
    <use href="#man-dark" x="222" y="102" width="36" height="36"/>
    <use href="#man-dark" x="262" y="102" width="36" height="36"/>
    <use href="#man-dark" x="302" y="102" width="36" height="36"/>
  </g>

  <!-- Light pieces: rows 6-7 (all 8 squares per row) -->
  <g id="light-pieces">
    <!-- Row 6 (y=220) -->
    <use href="#man-light" x="22" y="222" width="36" height="36"/>
    <use href="#man-light" x="62" y="222" width="36" height="36"/>
    <use href="#man-light" x="102" y="222" width="36" height="36"/>
    <use href="#man-light" x="142" y="222" width="36" height="36"/>
    <use href="#man-light" x="182" y="222" width="36" height="36"/>
    <use href="#man-light" x="222" y="222" width="36" height="36"/>
    <use href="#man-light" x="262" y="222" width="36" height="36"/>
    <use href="#man-light" x="302" y="222" width="36" height="36"/>
    <!-- Row 7 (y=260) -->
    <use href="#man-light" x="22" y="262" width="36" height="36"/>
    <use href="#man-light" x="62" y="262" width="36" height="36"/>
    <use href="#man-light" x="102" y="262" width="36" height="36"/>
    <use href="#man-light" x="142" y="262" width="36" height="36"/>
    <use href="#man-light" x="182" y="262" width="36" height="36"/>
    <use href="#man-light" x="222" y="262" width="36" height="36"/>
    <use href="#man-light" x="262" y="262" width="36" height="36"/>
    <use href="#man-light" x="302" y="262" width="36" height="36"/>
  </g>

  <g font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">
    <text x="40" y="355">a</text>
    <text x="80" y="355">b</text>
    <text x="120" y="355">c</text>
    <text x="160" y="355">d</text>
    <text x="200" y="355">e</text>
    <text x="240" y="355">f</text>
    <text x="280" y="355">g</text>
    <text x="320" y="355">h</text>
  </g>

  <g font-family="sans-serif" font-size="11" text-anchor="middle" fill="#555">
    <text x="10" y="44">8</text>
    <text x="10" y="84">7</text>
    <text x="10" y="124">6</text>
    <text x="10" y="164">5</text>
    <text x="10" y="204">4</text>
    <text x="10" y="244">3</text>
    <text x="10" y="284">2</text>
    <text x="10" y="324">1</text>
  </g>
</svg>
