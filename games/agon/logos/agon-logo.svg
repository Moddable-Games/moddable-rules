<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" aria-label="Agon logo">
  <rect width="100" height="100" fill="#1a1a2e" rx="8"/>
  <!-- Hexagonal board outline -->
  <polygon points="50,12 82,24 82,56 50,88 18,56 18,24" fill="none" stroke="#6c63ff" stroke-width="3"/>
  <!-- Inner hex ring -->
  <polygon points="50,28 66,36 66,52 50,72 34,52 34,36" fill="none" stroke="#6c63ff" stroke-width="2" opacity="0.6"/>
  <!-- Centre hex (goal) -->
  <polygon points="50,42 58,46 58,54 50,58 42,54 42,46" fill="#6c63ff" stroke="none"/>
  <!-- Queen piece (crown shape) -->
  <polygon points="44,48 47,43 50,46 53,43 56,48 53,52 47,52" fill="#f0e8d0" stroke="none"/>
</svg>
