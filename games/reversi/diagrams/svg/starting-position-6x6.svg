<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 350">
  <title>Reversi Starting Position 6x6</title>
  <rect width="320" height="350" fill="#f5f4ef"/>
  <!-- Board -->
  <rect x="35" y="20" width="270" height="270" fill="#dce8f5" stroke="#0c4f8d" stroke-width="2"/>
  <!-- Vertical grid lines -->
  <line x1="80" y1="20" x2="80" y2="290" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="125" y1="20" x2="125" y2="290" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="170" y1="20" x2="170" y2="290" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="215" y1="20" x2="215" y2="290" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="260" y1="20" x2="260" y2="290" stroke="#0c4f8d" stroke-width="1"/>
  <!-- Horizontal grid lines -->
  <line x1="35" y1="65" x2="305" y2="65" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="110" x2="305" y2="110" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="155" x2="305" y2="155" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="200" x2="305" y2="200" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="245" x2="305" y2="245" stroke="#0c4f8d" stroke-width="1"/>
  <!-- Column labels a-f -->
  <text x="57" y="308" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">a</text>
  <text x="102" y="308" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">b</text>
  <text x="147" y="308" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">c</text>
  <text x="192" y="308" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">d</text>
  <text x="237" y="308" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">e</text>
  <text x="282" y="308" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">f</text>
  <!-- Row labels 6-1 (6 at top) -->
  <text x="22" y="47" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">6</text>
  <text x="22" y="92" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">5</text>
  <text x="22" y="137" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">4</text>
  <text x="22" y="182" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">3</text>
  <text x="22" y="227" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">2</text>
  <text x="22" y="272" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">1</text>
  <!-- White at c3: col c=index2 x=35+2*45+22.5=147.5, row3=4th from top=index3 y=20+3*45+22.5=177.5 -->
  <circle cx="147.5" cy="177.5" r="19" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <!-- White at d4: col d=index3 x=192.5, row4=3rd from top=index2 y=20+2*45+22.5=132.5 -->
  <circle cx="192.5" cy="132.5" r="19" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <!-- Black at c4: col c=index2 x=147.5, row4=index2 y=132.5 -->
  <circle cx="147.5" cy="132.5" r="19" fill="#14161c" stroke="#14161c" stroke-width="1"/>
  <!-- Black at d3: col d=index3 x=192.5, row3=index3 y=177.5 -->
  <circle cx="192.5" cy="177.5" r="19" fill="#14161c" stroke="#14161c" stroke-width="1"/>
  <!-- Legend -->
  <circle cx="92" cy="330" r="8" fill="#14161c"/>
  <text x="106" y="334" font-family="sans-serif" font-size="12" fill="#14161c">Dark</text>
  <circle cx="170" cy="330" r="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="184" y="334" font-family="sans-serif" font-size="12" fill="#14161c">Light</text>
</svg>
