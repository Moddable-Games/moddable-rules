<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 460">
  <title>Reversi Starting Position 8x8</title>
  <rect width="410" height="460" fill="#f5f4ef"/>
  <!-- Board -->
  <rect x="35" y="30" width="360" height="360" fill="#dce8f5" stroke="#0c4f8d" stroke-width="2"/>
  <!-- Vertical grid lines -->
  <line x1="80" y1="30" x2="80" y2="390" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="125" y1="30" x2="125" y2="390" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="170" y1="30" x2="170" y2="390" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="215" y1="30" x2="215" y2="390" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="260" y1="30" x2="260" y2="390" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="305" y1="30" x2="305" y2="390" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="350" y1="30" x2="350" y2="390" stroke="#0c4f8d" stroke-width="1"/>
  <!-- Horizontal grid lines -->
  <line x1="35" y1="75" x2="395" y2="75" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="120" x2="395" y2="120" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="165" x2="395" y2="165" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="210" x2="395" y2="210" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="255" x2="395" y2="255" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="300" x2="395" y2="300" stroke="#0c4f8d" stroke-width="1"/>
  <line x1="35" y1="345" x2="395" y2="345" stroke="#0c4f8d" stroke-width="1"/>
  <!-- Column labels a-h -->
  <text x="57" y="414" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">a</text>
  <text x="102" y="414" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">b</text>
  <text x="147" y="414" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">c</text>
  <text x="192" y="414" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">d</text>
  <text x="237" y="414" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">e</text>
  <text x="282" y="414" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">f</text>
  <text x="327" y="414" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">g</text>
  <text x="372" y="414" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">h</text>
  <!-- Row labels 8-1 (8 at top) -->
  <text x="22" y="56" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">8</text>
  <text x="22" y="101" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">7</text>
  <text x="22" y="146" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">6</text>
  <text x="22" y="191" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">5</text>
  <text x="22" y="236" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">4</text>
  <text x="22" y="281" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">3</text>
  <text x="22" y="326" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">2</text>
  <text x="22" y="371" font-family="sans-serif" font-size="12" fill="#0c4f8d" text-anchor="middle">1</text>
  <!-- White disc at d4 (col d=index3, row4=4th from bottom=5th from top=index4) -->
  <!-- x = 35 + 3*45 + 22.5 = 192.5, y = 30 + 4*45 + 22.5 = 232.5 -->
  <circle cx="192.5" cy="232.5" r="19" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <!-- White disc at e5 (col e=index4, row5=5th from bottom=4th from top=index3) -->
  <!-- x = 35 + 4*45 + 22.5 = 237.5, y = 30 + 3*45 + 22.5 = 187.5 -->
  <circle cx="237.5" cy="187.5" r="19" fill="#ffffff" stroke="#555" stroke-width="2"/>
  <!-- Black disc at d5 (col d=index3, row5=4th from top=index3) -->
  <circle cx="192.5" cy="187.5" r="19" fill="#14161c" stroke="#14161c" stroke-width="1"/>
  <!-- Black disc at e4 (col e=index4, row4=5th from top=index4) -->
  <circle cx="237.5" cy="232.5" r="19" fill="#14161c" stroke="#14161c" stroke-width="1"/>
  <!-- Legend (centred on viewBox midpoint 205) -->
  <circle cx="155" cy="440" r="8" fill="#14161c"/>
  <text x="169" y="444" font-family="sans-serif" font-size="12" fill="#14161c">Dark</text>
  <circle cx="230" cy="440" r="8" fill="#ffffff" stroke="#555" stroke-width="1.5"/>
  <text x="244" y="444" font-family="sans-serif" font-size="12" fill="#14161c">Light</text>
</svg>
