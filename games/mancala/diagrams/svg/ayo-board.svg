<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="400" height="180">
  <title>Ayo — starting position (2x6, 4 seeds per pit, no stores)</title>

  <!-- Wooden board background -->
  <rect x="10" y="20" width="380" height="140" rx="20" ry="20" fill="#8B6B3D"/>
  <rect x="14" y="24" width="372" height="132" rx="18" ry="18" fill="#A0803B"/>

  <!-- Top row pits (Player 2) -->
  <g id="top-row">
    <circle cx="72" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="132" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="192" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="252" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="312" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="372" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
  </g>

  <!-- Bottom row pits (Player 1) -->
  <g id="bottom-row">
    <circle cx="72" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="132" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="192" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="252" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="312" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="372" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
  </g>

  <!-- Seeds in top row (4 per pit) -->
  <g id="seeds-top" fill="#444" stroke="#333" stroke-width="0.5">
    <circle cx="65" cy="56" r="4"/><circle cx="79" cy="56" r="4"/>
    <circle cx="65" cy="68" r="4"/><circle cx="79" cy="68" r="4"/>
    <circle cx="125" cy="56" r="4"/><circle cx="139" cy="56" r="4"/>
    <circle cx="125" cy="68" r="4"/><circle cx="139" cy="68" r="4"/>
    <circle cx="185" cy="56" r="4"/><circle cx="199" cy="56" r="4"/>
    <circle cx="185" cy="68" r="4"/><circle cx="199" cy="68" r="4"/>
    <circle cx="245" cy="56" r="4"/><circle cx="259" cy="56" r="4"/>
    <circle cx="245" cy="68" r="4"/><circle cx="259" cy="68" r="4"/>
    <circle cx="305" cy="56" r="4"/><circle cx="319" cy="56" r="4"/>
    <circle cx="305" cy="68" r="4"/><circle cx="319" cy="68" r="4"/>
    <circle cx="365" cy="56" r="4"/><circle cx="379" cy="56" r="4"/>
    <circle cx="365" cy="68" r="4"/><circle cx="379" cy="68" r="4"/>
  </g>

  <!-- Seeds in bottom row (4 per pit) -->
  <g id="seeds-bottom" fill="#444" stroke="#333" stroke-width="0.5">
    <circle cx="65" cy="112" r="4"/><circle cx="79" cy="112" r="4"/>
    <circle cx="65" cy="124" r="4"/><circle cx="79" cy="124" r="4"/>
    <circle cx="125" cy="112" r="4"/><circle cx="139" cy="112" r="4"/>
    <circle cx="125" cy="124" r="4"/><circle cx="139" cy="124" r="4"/>
    <circle cx="185" cy="112" r="4"/><circle cx="199" cy="112" r="4"/>
    <circle cx="185" cy="124" r="4"/><circle cx="199" cy="124" r="4"/>
    <circle cx="245" cy="112" r="4"/><circle cx="259" cy="112" r="4"/>
    <circle cx="245" cy="124" r="4"/><circle cx="259" cy="124" r="4"/>
    <circle cx="305" cy="112" r="4"/><circle cx="319" cy="112" r="4"/>
    <circle cx="305" cy="124" r="4"/><circle cx="319" cy="124" r="4"/>
    <circle cx="365" cy="112" r="4"/><circle cx="379" cy="112" r="4"/>
    <circle cx="365" cy="124" r="4"/><circle cx="379" cy="124" r="4"/>
  </g>
</svg>
