    <circle cx="344" cy="60" r="3"/><circle cx="352" cy="60" r="3"/>
    <circle cx="341" cy="67" r="3"/><circle cx="355" cy="67" r="3"/>
    <!-- Pit 6 -->
    <circle cx="401" cy="52" r="3"/><circle cx="408" cy="49" r="3"/><circle cx="415" cy="52" r="3"/>
    <circle cx="404" cy="60" r="3"/><circle cx="412" cy="60" r="3"/>
    <circle cx="401" cy="67" r="3"/><circle cx="415" cy="67" r="3"/>
    <!-- Pit 7 -->
    <circle cx="461" cy="52" r="3"/><circle cx="468" cy="49" r="3"/><circle cx="475" cy="52" r="3"/>
    <circle cx="464" cy="60" r="3"/><circle cx="472" cy="60" r="3"/>
    <circle cx="461" cy="67" r="3"/><circle cx="475" cy="67" r="3"/>
