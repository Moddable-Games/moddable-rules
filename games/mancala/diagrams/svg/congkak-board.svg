<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 180" width="540" height="180">
  <title>Congkak — starting position (2x7 pits + 2 stores, 7 seeds per pit)</title>

  <!-- Wooden board background (elongated/boat shape) -->
  <ellipse cx="270" cy="90" rx="260" ry="75" fill="#8B6B3D"/>
  <ellipse cx="270" cy="90" rx="256" ry="71" fill="#A0803B"/>

  <!-- Left store (Player 2's storehouse) -->
  <ellipse cx="42" cy="90" rx="20" ry="38" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>

  <!-- Right store (Player 1's storehouse) -->
  <ellipse cx="498" cy="90" rx="20" ry="38" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>

  <!-- Top row pits (Player 2, 7 pits) -->
  <g id="top-row">
    <circle cx="108" cy="58" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="168" cy="58" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="228" cy="58" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="288" cy="58" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="348" cy="58" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="408" cy="58" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="468" cy="58" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
  </g>

  <!-- Bottom row pits (Player 1, 7 pits) -->
  <g id="bottom-row">
    <circle cx="108" cy="122" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="168" cy="122" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="228" cy="122" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="288" cy="122" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="348" cy="122" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="408" cy="122" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="468" cy="122" r="20" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
  </g>

  <!-- Seeds in top row (7 per pit, arranged in cluster) -->
