    <circle cx="101" cy="52" r="3"/><circle cx="108" cy="49" r="3"/><circle cx="115" cy="52" r="3"/>
    <circle cx="104" cy="60" r="3"/><circle cx="112" cy="60" r="3"/>
    <circle cx="101" cy="67" r="3"/><circle cx="115" cy="67" r="3"/>
    <!-- Pit 2 -->
    <circle cx="161" cy="52" r="3"/><circle cx="168" cy="49" r="3"/><circle cx="175" cy="52" r="3"/>
    <circle cx="164" cy="60" r="3"/><circle cx="172" cy="60" r="3"/>
    <circle cx="161" cy="67" r="3"/><circle cx="175" cy="67" r="3"/>
    <!-- Pit 3 -->
    <circle cx="221" cy="52" r="3"/><circle cx="228" cy="49" r="3"/><circle cx="235" cy="52" r="3"/>
    <circle cx="224" cy="60" r="3"/><circle cx="232" cy="60" r="3"/>
    <circle cx="221" cy="67" r="3"/><circle cx="235" cy="67" r="3"/>
    <!-- Pit 4 -->
    <circle cx="281" cy="52" r="3"/><circle cx="288" cy="49" r="3"/><circle cx="295" cy="52" r="3"/>
    <circle cx="284" cy="60" r="3"/><circle cx="292" cy="60" r="3"/>
    <circle cx="281" cy="67" r="3"/><circle cx="295" cy="67" r="3"/>
    <!-- Pit 5 -->
