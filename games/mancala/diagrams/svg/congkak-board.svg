    <circle cx="101" cy="116" r="3"/><circle cx="108" cy="113" r="3"/><circle cx="115" cy="116" r="3"/>
    <circle cx="104" cy="124" r="3"/><circle cx="112" cy="124" r="3"/>
    <circle cx="101" cy="131" r="3"/><circle cx="115" cy="131" r="3"/>
    <!-- Pit 2 -->
    <circle cx="161" cy="116" r="3"/><circle cx="168" cy="113" r="3"/><circle cx="175" cy="116" r="3"/>
    <circle cx="164" cy="124" r="3"/><circle cx="172" cy="124" r="3"/>
    <circle cx="161" cy="131" r="3"/><circle cx="175" cy="131" r="3"/>
    <!-- Pit 3 -->
    <circle cx="221" cy="116" r="3"/><circle cx="228" cy="113" r="3"/><circle cx="235" cy="116" r="3"/>
    <circle cx="224" cy="124" r="3"/><circle cx="232" cy="124" r="3"/>
    <circle cx="221" cy="131" r="3"/><circle cx="235" cy="131" r="3"/>
    <!-- Pit 4 -->
    <circle cx="281" cy="116" r="3"/><circle cx="288" cy="113" r="3"/><circle cx="295" cy="116" r="3"/>
    <circle cx="284" cy="124" r="3"/><circle cx="292" cy="124" r="3"/>
    <circle cx="281" cy="131" r="3"/><circle cx="295" cy="131" r="3"/>
    <!-- Pit 5 -->
    <circle cx="341" cy="116" r="3"/><circle cx="348" cy="113" r="3"/><circle cx="355" cy="116" r="3"/>
    <circle cx="344" cy="124" r="3"/><circle cx="352" cy="124" r="3"/>
    <circle cx="341" cy="131" r="3"/><circle cx="355" cy="131" r="3"/>
    <!-- Pit 6 -->
    <circle cx="401" cy="116" r="3"/><circle cx="408" cy="113" r="3"/><circle cx="415" cy="116" r="3"/>
    <circle cx="404" cy="124" r="3"/><circle cx="412" cy="124" r="3"/>
    <circle cx="401" cy="131" r="3"/><circle cx="415" cy="131" r="3"/>
    <!-- Pit 7 -->
    <circle cx="461" cy="116" r="3"/><circle cx="468" cy="113" r="3"/><circle cx="475" cy="116" r="3"/>
    <circle cx="464" cy="124" r="3"/><circle cx="472" cy="124" r="3"/>
    <circle cx="461" cy="131" r="3"/><circle cx="475" cy="131" r="3"/>
  </g>
