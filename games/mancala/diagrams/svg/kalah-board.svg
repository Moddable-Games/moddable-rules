<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 180" width="480" height="180">
  <title>Kalah — starting position (2x6 pits + 2 stores, 4 seeds per pit)</title>

  <!-- Wooden board background -->
  <rect x="10" y="20" width="460" height="140" rx="20" ry="20" fill="#8B6B3D"/>
  <rect x="14" y="24" width="452" height="132" rx="18" ry="18" fill="#A0803B"/>

  <!-- Left store (Player 2's mancala) -->
  <ellipse cx="50" cy="90" rx="22" ry="42" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>

  <!-- Right store (Player 1's mancala) -->
  <ellipse cx="430" cy="90" rx="22" ry="42" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>

  <!-- Top row pits (Player 2) -->
  <g id="top-row">
    <circle cx="120" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="176" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="232" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="288" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="344" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="400" cy="62" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
  </g>

  <!-- Bottom row pits (Player 1) -->
  <g id="bottom-row">
    <circle cx="120" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="176" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="232" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="288" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="344" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
    <circle cx="400" cy="118" r="22" fill="#5a3e28" stroke="#4a2e18" stroke-width="1.5"/>
  </g>

  <!-- Seeds in top row (4 per pit) -->
  <g id="seeds-top" fill="#444" stroke="#333" stroke-width="0.5">
    <circle cx="113" cy="56" r="4"/><circle cx="127" cy="56" r="4"/>
    <circle cx="113" cy="68" r="4"/><circle cx="127" cy="68" r="4"/>
    <circle cx="169" cy="56" r="4"/><circle cx="183" cy="56" r="4"/>
    <circle cx="169" cy="68" r="4"/><circle cx="183" cy="68" r="4"/>
    <circle cx="225" cy="56" r="4"/><circle cx="239" cy="56" r="4"/>
    <circle cx="225" cy="68" r="4"/><circle cx="239" cy="68" r="4"/>
    <circle cx="281" cy="56" r="4"/><circle cx="295" cy="56" r="4"/>
    <circle cx="281" cy="68" r="4"/><circle cx="295" cy="68" r="4"/>
    <circle cx="337" cy="56" r="4"/><circle cx="351" cy="56" r="4"/>
    <circle cx="337" cy="68" r="4"/><circle cx="351" cy="68" r="4"/>
    <circle cx="393" cy="56" r="4"/><circle cx="407" cy="56" r="4"/>
    <circle cx="393" cy="68" r="4"/><circle cx="407" cy="68" r="4"/>
  </g>

  <!-- Seeds in bottom row (4 per pit) -->
  <g id="seeds-bottom" fill="#444" stroke="#333" stroke-width="0.5">
    <circle cx="113" cy="112" r="4"/><circle cx="127" cy="112" r="4"/>
    <circle cx="113" cy="124" r="4"/><circle cx="127" cy="124" r="4"/>
    <circle cx="169" cy="112" r="4"/><circle cx="183" cy="112" r="4"/>
    <circle cx="169" cy="124" r="4"/><circle cx="183" cy="124" r="4"/>
    <circle cx="225" cy="112" r="4"/><circle cx="239" cy="112" r="4"/>
    <circle cx="225" cy="124" r="4"/><circle cx="239" cy="124" r="4"/>
    <circle cx="281" cy="112" r="4"/><circle cx="295" cy="112" r="4"/>
    <circle cx="281" cy="124" r="4"/><circle cx="295" cy="124" r="4"/>
    <circle cx="337" cy="112" r="4"/><circle cx="351" cy="112" r="4"/>
    <circle cx="337" cy="124" r="4"/><circle cx="351" cy="124" r="4"/>
    <circle cx="393" cy="112" r="4"/><circle cx="407" cy="112" r="4"/>
    <circle cx="393" cy="124" r="4"/><circle cx="407" cy="124" r="4"/>
  </g>
</svg>
