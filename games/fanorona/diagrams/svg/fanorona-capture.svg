<svg xmlns="http://www.w3.org/2000/svg" width="420" height="185" viewBox="0 0 420 185">
<title>Fanorona: approach and withdrawal capture</title>
<defs>
  <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0,0 8,3 0,6" fill="#2a8020"/>
  </marker>
</defs>
<rect width="420" height="185" fill="#fdf5e4"/>
<!-- Panel titles -->
<text x="87" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2a1200">Approach Capture</text>
<text x="323" y="20" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2a1200">Withdrawal Capture</text>
<!-- Left panel board background -->
<rect x="10" y="28" width="154" height="108" fill="#d4a96a" rx="3"/>
<!-- Right panel board background -->
<rect x="250" y="28" width="154" height="108" fill="#d4a96a" rx="3"/>
<!-- Left panel grid: 4 cols x 3 rows, cell=46, x0=18, y0=36 -->
<line x1="18" y1="36" x2="156" y2="36" stroke="#7a4510" stroke-width="1.5"/>
<line x1="18" y1="82" x2="156" y2="82" stroke="#7a4510" stroke-width="1.5"/>
<line x1="18" y1="128" x2="156" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<line x1="18" y1="36" x2="18" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<line x1="64" y1="36" x2="64" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<line x1="110" y1="36" x2="110" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<line x1="156" y1="36" x2="156" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<!-- Left panel diagonals -->
<line x1="18" y1="36" x2="64" y2="82" stroke="#7a4510" stroke-width="1"/>
<line x1="110" y1="36" x2="156" y2="82" stroke="#7a4510" stroke-width="1"/>
<line x1="110" y1="36" x2="64" y2="82" stroke="#7a4510" stroke-width="1"/>
<line x1="64" y1="82" x2="110" y2="128" stroke="#7a4510" stroke-width="1"/>
<line x1="64" y1="82" x2="18" y2="128" stroke="#7a4510" stroke-width="1"/>
<line x1="156" y1="82" x2="110" y2="128" stroke="#7a4510" stroke-width="1"/>
<!-- Left panel intersection dots -->
<circle cx="18" cy="36" r="2.5" fill="#5a3610"/><circle cx="64" cy="36" r="2.5" fill="#5a3610"/><circle cx="110" cy="36" r="2.5" fill="#5a3610"/><circle cx="156" cy="36" r="2.5" fill="#5a3610"/>
<circle cx="18" cy="82" r="2.5" fill="#5a3610"/><circle cx="64" cy="82" r="2.5" fill="#5a3610"/><circle cx="110" cy="82" r="2.5" fill="#5a3610"/><circle cx="156" cy="82" r="2.5" fill="#5a3610"/>
<circle cx="18" cy="128" r="2.5" fill="#5a3610"/><circle cx="64" cy="128" r="2.5" fill="#5a3610"/><circle cx="110" cy="128" r="2.5" fill="#5a3610"/><circle cx="156" cy="128" r="2.5" fill="#5a3610"/>
<!-- Left panel: White piece at (18,82) -->
<circle cx="18" cy="82" r="16" fill="#f0e8d0" stroke="#7a4510" stroke-width="2"/>
<!-- Left panel: Arrow -->
<line x1="35" y1="82" x2="48" y2="82" stroke="#2a8020" stroke-width="2" marker-end="url(#arr)"/>
<!-- Left panel: Destination (dashed circle) at (64,82) -->
<circle cx="64" cy="82" r="16" fill="none" stroke="#2a8020" stroke-width="1.5" stroke-dasharray="4,3"/>
<!-- Left panel: Black piece B1 at (110,82) with X -->
<circle cx="110" cy="82" r="16" fill="#1e1000" stroke="#c8963c" stroke-width="1.5"/>
<line x1="98" y1="70" x2="122" y2="94" stroke="#cc3030" stroke-width="2.5"/>
<line x1="122" y1="70" x2="98" y2="94" stroke="#cc3030" stroke-width="2.5"/>
<!-- Left panel: Black piece B2 at (156,82) with X -->
<circle cx="156" cy="82" r="16" fill="#1e1000" stroke="#c8963c" stroke-width="1.5"/>
<line x1="144" y1="70" x2="168" y2="94" stroke="#cc3030" stroke-width="2.5"/>
<line x1="168" y1="70" x2="144" y2="94" stroke="#cc3030" stroke-width="2.5"/>
<!-- Right panel grid: x0=258, y0=36 -->
<line x1="258" y1="36" x2="396" y2="36" stroke="#7a4510" stroke-width="1.5"/>
<line x1="258" y1="82" x2="396" y2="82" stroke="#7a4510" stroke-width="1.5"/>
<line x1="258" y1="128" x2="396" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<line x1="258" y1="36" x2="258" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<line x1="304" y1="36" x2="304" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<line x1="350" y1="36" x2="350" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<line x1="396" y1="36" x2="396" y2="128" stroke="#7a4510" stroke-width="1.5"/>
<!-- Right panel diagonals -->
<line x1="258" y1="36" x2="304" y2="82" stroke="#7a4510" stroke-width="1"/>
<line x1="350" y1="36" x2="396" y2="82" stroke="#7a4510" stroke-width="1"/>
<line x1="350" y1="36" x2="304" y2="82" stroke="#7a4510" stroke-width="1"/>
<line x1="304" y1="82" x2="350" y2="128" stroke="#7a4510" stroke-width="1"/>
<line x1="304" y1="82" x2="258" y2="128" stroke="#7a4510" stroke-width="1"/>
<line x1="396" y1="82" x2="350" y2="128" stroke="#7a4510" stroke-width="1"/>
<!-- Right panel intersection dots -->
<circle cx="258" cy="36" r="2.5" fill="#5a3610"/><circle cx="304" cy="36" r="2.5" fill="#5a3610"/><circle cx="350" cy="36" r="2.5" fill="#5a3610"/><circle cx="396" cy="36" r="2.5" fill="#5a3610"/>
<circle cx="258" cy="82" r="2.5" fill="#5a3610"/><circle cx="304" cy="82" r="2.5" fill="#5a3610"/><circle cx="350" cy="82" r="2.5" fill="#5a3610"/><circle cx="396" cy="82" r="2.5" fill="#5a3610"/>
<circle cx="258" cy="128" r="2.5" fill="#5a3610"/><circle cx="304" cy="128" r="2.5" fill="#5a3610"/><circle cx="350" cy="128" r="2.5" fill="#5a3610"/><circle cx="396" cy="128" r="2.5" fill="#5a3610"/>
<!-- Right panel: Black piece B1 at (258,82) with X -->
<circle cx="258" cy="82" r="16" fill="#1e1000" stroke="#c8963c" stroke-width="1.5"/>
<line x1="246" y1="70" x2="270" y2="94" stroke="#cc3030" stroke-width="2.5"/>
<line x1="270" y1="70" x2="246" y2="94" stroke="#cc3030" stroke-width="2.5"/>
<!-- Right panel: Black piece B2 at (304,82) with X -->
<circle cx="304" cy="82" r="16" fill="#1e1000" stroke="#c8963c" stroke-width="1.5"/>
<line x1="292" y1="70" x2="316" y2="94" stroke="#cc3030" stroke-width="2.5"/>
<line x1="316" y1="70" x2="292" y2="94" stroke="#cc3030" stroke-width="2.5"/>
<!-- Right panel: White piece at (350,82) -->
<circle cx="350" cy="82" r="16" fill="#f0e8d0" stroke="#7a4510" stroke-width="2"/>
<!-- Right panel: Arrow -->
<line x1="367" y1="82" x2="380" y2="82" stroke="#2a8020" stroke-width="2" marker-end="url(#arr)"/>
<!-- Right panel: Destination (dashed circle) at (396,82) -->
<circle cx="396" cy="82" r="16" fill="none" stroke="#2a8020" stroke-width="1.5" stroke-dasharray="4,3"/>
<!-- Captions -->
<text x="87" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2a1200">Approach: W moves right toward B.</text>
<text x="87" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2a1200">B pieces ahead are captured.</text>
<text x="323" y="152" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2a1200">Withdrawal: W moves right, away from B.</text>
<text x="323" y="168" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#2a1200">B pieces behind are captured.</text>
</svg>
