<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" aria-label="Bavarian 32 logo">
  <rect width="100" height="100" fill="#0d3b1e" rx="8"/>
  <!-- Card shape with Bavarian/German styling -->
  <rect x="24" y="18" width="52" height="64" rx="5" fill="#f5f4ef" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Acorns (Eichel) - the distinctive Bavarian suit -->
  <ellipse cx="42" cy="42" rx="6" ry="8" fill="#5a3a1a"/>
  <rect x="40" y="32" width="4" height="6" rx="2" fill="#2a6a2a"/>
  <ellipse cx="58" cy="42" rx="6" ry="8" fill="#5a3a1a"/>
  <rect x="56" y="32" width="4" height="6" rx="2" fill="#2a6a2a"/>
  <!-- Bells (Schellen) - another distinctive Bavarian suit -->
  <circle cx="42" cy="62" r="7" fill="none" stroke="#d4a020" stroke-width="2.5"/>
  <circle cx="42" cy="62" r="3" fill="#d4a020"/>
  <circle cx="58" cy="62" r="7" fill="none" stroke="#d4a020" stroke-width="2.5"/>
  <circle cx="58" cy="62" r="3" fill="#d4a020"/>
</svg>
