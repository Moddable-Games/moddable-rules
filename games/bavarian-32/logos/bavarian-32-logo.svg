  <rect x="20" y="16" width="40" height="56" rx="4" fill="#f1faee" stroke="#5a3a1a" stroke-width="2"/>
  <rect x="28" y="22" width="40" height="56" rx="4" fill="#fefae0" stroke="#264653" stroke-width="2"/>
  <!-- Front card: acorn (Eichel) suit icon + rank -->
