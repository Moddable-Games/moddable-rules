<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Harvesters logo">
  <title>Harvesters</title>
  <!-- Three wheat stalks forming a sheaf -->
  <g stroke="#4a7c3f" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Centre stalk -->
    <line x1="50" y1="88" x2="50" y2="20"/>
    <!-- Left stalk -->
    <line x1="50" y1="88" x2="34" y2="24"/>
    <!-- Right stalk -->
    <line x1="50" y1="88" x2="66" y2="24"/>
  </g>
  <!-- Grain kernels -->
  <g fill="#4a7c3f">
    <!-- Centre stalk grains -->
    <ellipse cx="50" cy="20" rx="4" ry="7"/>
    <ellipse cx="46" cy="32" rx="3.5" ry="6" transform="rotate(-10 46 32)"/>
    <ellipse cx="54" cy="32" rx="3.5" ry="6" transform="rotate(10 54 32)"/>
    <!-- Left stalk grains -->
    <ellipse cx="34" cy="24" rx="4" ry="7" transform="rotate(-12 34 24)"/>
    <ellipse cx="31" cy="36" rx="3.5" ry="6" transform="rotate(-20 31 36)"/>
    <ellipse cx="37" cy="35" rx="3.5" ry="6" transform="rotate(-5 37 35)"/>
    <!-- Right stalk grains -->
    <ellipse cx="66" cy="24" rx="4" ry="7" transform="rotate(12 66 24)"/>
    <ellipse cx="63" cy="35" rx="3.5" ry="6" transform="rotate(5 63 35)"/>
    <ellipse cx="69" cy="36" rx="3.5" ry="6" transform="rotate(20 69 36)"/>
  </g>
  <!-- Binding band -->
  <path d="M38,72 Q50,66 62,72" stroke="#4a7c3f" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
