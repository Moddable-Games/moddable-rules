<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <title>Surakarta board — 6×6 grid with 8 corner loop arcs</title>
  <rect width="700" height="700" fill="#f5f4ef"/>

  <!-- Title -->
  <text x="350" y="38" font-family="'Inter Tight',Inter,sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#14161c" letter-spacing="2">SURAKARTA</text>
  <text x="350" y="60" font-family="Inter,sans-serif" font-size="12" text-anchor="middle" fill="#55534f">Starting position · 6×6 grid with corner loop arcs</text>

  <!-- Column labels A–F -->
  <text x="150" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">A</text>
  <text x="230" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">B</text>
  <text x="310" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">C</text>
  <text x="390" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">D</text>
  <text x="470" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">E</text>
  <text x="550" y="130" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">F</text>

  <!-- Row labels 1–6 -->
  <text x="128" y="155" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">1</text>
  <text x="128" y="235" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">2</text>
  <text x="128" y="315" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">3</text>
  <text x="128" y="395" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">4</text>
  <text x="128" y="475" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">5</text>
  <text x="128" y="555" text-anchor="middle" dominant-baseline="middle" font-family="Inter,sans-serif" font-size="14" fill="#888">6</text>

  <!-- Grid horizontal lines -->
  <line x1="150" y1="150" x2="550" y2="150" stroke="#14161c" stroke-width="1.5"/>
  <line x1="150" y1="230" x2="550" y2="230" stroke="#14161c" stroke-width="1.5"/>
  <line x1="150" y1="310" x2="550" y2="310" stroke="#14161c" stroke-width="1.5"/>
  <line x1="150" y1="390" x2="550" y2="390" stroke="#14161c" stroke-width="1.5"/>
  <line x1="150" y1="470" x2="550" y2="470" stroke="#14161c" stroke-width="1.5"/>
  <line x1="150" y1="550" x2="550" y2="550" stroke="#14161c" stroke-width="1.5"/>

  <!-- Grid vertical lines -->
  <line x1="150" y1="150" x2="150" y2="550" stroke="#14161c" stroke-width="1.5"/>
  <line x1="230" y1="150" x2="230" y2="550" stroke="#14161c" stroke-width="1.5"/>
  <line x1="310" y1="150" x2="310" y2="550" stroke="#14161c" stroke-width="1.5"/>
  <line x1="390" y1="150" x2="390" y2="550" stroke="#14161c" stroke-width="1.5"/>
  <line x1="470" y1="150" x2="470" y2="550" stroke="#14161c" stroke-width="1.5"/>
  <line x1="550" y1="150" x2="550" y2="550" stroke="#14161c" stroke-width="1.5"/>

  <!-- Inner loop arcs (blue, r=80) connecting 2nd intersections from each corner -->
  <!-- Top-left: (230,150) to (150,230), sweep CCW (large-arc=1, sweep=0) -->
  <path d="M 230,150 A 80,80 0 1,0 150,230" fill="none" stroke="#0c4f8d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top-right: (470,150) to (550,230), sweep CW (large-arc=1, sweep=1) -->
  <path d="M 470,150 A 80,80 0 1,1 550,230" fill="none" stroke="#0c4f8d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-left: (150,470) to (230,550), sweep CCW (large-arc=1, sweep=0) -->
  <path d="M 150,470 A 80,80 0 1,0 230,550" fill="none" stroke="#0c4f8d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-right: (550,470) to (470,550), sweep CW (large-arc=1, sweep=1) -->
  <path d="M 550,470 A 80,80 0 1,1 470,550" fill="none" stroke="#0c4f8d" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Outer loop arcs (red, r=160) connecting 3rd intersections from each corner -->
  <!-- Top-left: (310,150) to (150,310), sweep CCW -->
  <path d="M 310,150 A 160,160 0 1,0 150,310" fill="none" stroke="#d11a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top-right: (390,150) to (550,310), sweep CW -->
  <path d="M 390,150 A 160,160 0 1,1 550,310" fill="none" stroke="#d11a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-left: (150,390) to (310,550), sweep CCW -->
  <path d="M 150,390 A 160,160 0 1,0 310,550" fill="none" stroke="#d11a1a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom-right: (550,390) to (390,550), sweep CW -->
  <path d="M 550,390 A 160,160 0 1,1 390,550" fill="none" stroke="#d11a1a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dark pieces: rows 1–2 (y=150 and y=230) -->
  <circle cx="150" cy="150" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="230" cy="150" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="310" cy="150" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="390" cy="150" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="470" cy="150" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="550" cy="150" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="150" cy="230" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="230" cy="230" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="310" cy="230" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="390" cy="230" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="470" cy="230" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>
  <circle cx="550" cy="230" r="20" fill="#14161c" stroke="#f5f4ef" stroke-width="1.5"/>

  <!-- Empty intersection dots: rows 3–4 (y=310 and y=390) -->
  <circle cx="150" cy="310" r="4" fill="#14161c"/>
  <circle cx="230" cy="310" r="4" fill="#14161c"/>
  <circle cx="310" cy="310" r="4" fill="#14161c"/>
  <circle cx="390" cy="310" r="4" fill="#14161c"/>
  <circle cx="470" cy="310" r="4" fill="#14161c"/>
  <circle cx="550" cy="310" r="4" fill="#14161c"/>
  <circle cx="150" cy="390" r="4" fill="#14161c"/>
  <circle cx="230" cy="390" r="4" fill="#14161c"/>
  <circle cx="310" cy="390" r="4" fill="#14161c"/>
  <circle cx="390" cy="390" r="4" fill="#14161c"/>
  <circle cx="470" cy="390" r="4" fill="#14161c"/>
  <circle cx="550" cy="390" r="4" fill="#14161c"/>

  <!-- Light pieces: rows 5–6 (y=470 and y=550) -->
  <circle cx="150" cy="470" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="230" cy="470" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="310" cy="470" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="390" cy="470" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="470" cy="470" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="550" cy="470" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="150" cy="550" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="230" cy="550" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="310" cy="550" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="390" cy="550" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="470" cy="550" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>
  <circle cx="550" cy="550" r="20" fill="#e8e5d8" stroke="#14161c" stroke-width="1.5"/>

  <!-- Legend -->
  <line x1="386" y1="628" x2="426" y2="628" stroke="#0c4f8d" stroke-width="2.5" stroke-linecap="round"/>
  <text x="434" y="633" font-family="Inter,sans-serif" font-size="13" fill="#14161c">Inner loop</text>
  <line x1="386" y1="652" x2="426" y2="652" stroke="#d11a1a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="434" y="657" font-family="Inter,sans-serif" font-size="13" fill="#14161c">Outer loop</text>
</svg>
