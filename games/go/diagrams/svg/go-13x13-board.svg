<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <title>Go — 13×13 board (empty)</title>

  <rect x="0" y="0" width="320" height="320" fill="#dcb35c"/>
  <rect x="15" y="15" width="290" height="290" fill="#d4a843" rx="2"/>

  <g stroke="#3d2b1a" stroke-width="0.8">
    <line x1="30" y1="30" x2="270" y2="30"/><line x1="30" y1="50" x2="270" y2="50"/>
    <line x1="30" y1="70" x2="270" y2="70"/><line x1="30" y1="90" x2="270" y2="90"/>
    <line x1="30" y1="110" x2="270" y2="110"/><line x1="30" y1="130" x2="270" y2="130"/>
    <line x1="30" y1="150" x2="270" y2="150"/><line x1="30" y1="170" x2="270" y2="170"/>
    <line x1="30" y1="190" x2="270" y2="190"/><line x1="30" y1="210" x2="270" y2="210"/>
    <line x1="30" y1="230" x2="270" y2="230"/><line x1="30" y1="250" x2="270" y2="250"/>
    <line x1="30" y1="270" x2="270" y2="270"/>
    <line x1="30" y1="30" x2="30" y2="270"/><line x1="50" y1="30" x2="50" y2="270"/>
    <line x1="70" y1="30" x2="70" y2="270"/><line x1="90" y1="30" x2="90" y2="270"/>
    <line x1="110" y1="30" x2="110" y2="270"/><line x1="130" y1="30" x2="130" y2="270"/>
    <line x1="150" y1="30" x2="150" y2="270"/><line x1="170" y1="30" x2="170" y2="270"/>
    <line x1="190" y1="30" x2="190" y2="270"/><line x1="210" y1="30" x2="210" y2="270"/>
    <line x1="230" y1="30" x2="230" y2="270"/><line x1="250" y1="30" x2="250" y2="270"/>
    <line x1="270" y1="30" x2="270" y2="270"/>
  </g>

  <!-- Star points: 4 corners (4-4) + centre -->
  <g fill="#3d2b1a">
    <circle cx="90" cy="90" r="3"/>
    <circle cx="210" cy="90" r="3"/>
    <circle cx="150" cy="150" r="3"/>
    <circle cx="90" cy="210" r="3"/>
    <circle cx="210" cy="210" r="3"/>
  </g>

  <g font-family="sans-serif" font-size="8" text-anchor="middle" fill="#5a4020">
    <text x="30" y="295">A</text><text x="50" y="295">B</text>
    <text x="70" y="295">C</text><text x="90" y="295">D</text>
    <text x="110" y="295">E</text><text x="130" y="295">F</text>
    <text x="150" y="295">G</text><text x="170" y="295">H</text>
    <text x="190" y="295">J</text><text x="210" y="295">K</text>
    <text x="230" y="295">L</text><text x="250" y="295">M</text>
    <text x="270" y="295">N</text>
    <text x="14" y="273">1</text><text x="14" y="253">2</text>
    <text x="14" y="233">3</text><text x="14" y="213">4</text>
    <text x="14" y="193">5</text><text x="14" y="173">6</text>
    <text x="14" y="153">7</text><text x="14" y="133">8</text>
    <text x="14" y="113">9</text><text x="11" y="93">10</text>
    <text x="11" y="73">11</text><text x="11" y="53">12</text>
    <text x="11" y="33">13</text>
  </g>
</svg>
