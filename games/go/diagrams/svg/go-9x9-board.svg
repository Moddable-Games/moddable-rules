<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <title>Go — 9×9 board (empty)</title>

  <rect x="0" y="0" width="240" height="240" fill="#dcb35c"/>
  <rect x="15" y="15" width="210" height="210" fill="#d4a843" rx="2"/>

  <g stroke="#3d2b1a" stroke-width="0.8">
    <line x1="30" y1="30" x2="190" y2="30"/><line x1="30" y1="50" x2="190" y2="50"/>
    <line x1="30" y1="70" x2="190" y2="70"/><line x1="30" y1="90" x2="190" y2="90"/>
    <line x1="30" y1="110" x2="190" y2="110"/><line x1="30" y1="130" x2="190" y2="130"/>
    <line x1="30" y1="150" x2="190" y2="150"/><line x1="30" y1="170" x2="190" y2="170"/>
    <line x1="30" y1="190" x2="190" y2="190"/>
    <line x1="30" y1="30" x2="30" y2="190"/><line x1="50" y1="30" x2="50" y2="190"/>
    <line x1="70" y1="30" x2="70" y2="190"/><line x1="90" y1="30" x2="90" y2="190"/>
    <line x1="110" y1="30" x2="110" y2="190"/><line x1="130" y1="30" x2="130" y2="190"/>
    <line x1="150" y1="30" x2="150" y2="190"/><line x1="170" y1="30" x2="170" y2="190"/>
    <line x1="190" y1="30" x2="190" y2="190"/>
  </g>

  <!-- Star points: 4 corners (3-3) + centre -->
  <g fill="#3d2b1a">
    <circle cx="70" cy="70" r="3"/>
    <circle cx="150" cy="70" r="3"/>
    <circle cx="110" cy="110" r="3"/>
    <circle cx="70" cy="150" r="3"/>
    <circle cx="150" cy="150" r="3"/>
  </g>

  <g font-family="sans-serif" font-size="8" text-anchor="middle" fill="#5a4020">
    <text x="30" y="215">A</text><text x="50" y="215">B</text>
    <text x="70" y="215">C</text><text x="90" y="215">D</text>
    <text x="110" y="215">E</text><text x="130" y="215">F</text>
    <text x="150" y="215">G</text><text x="170" y="215">H</text>
    <text x="190" y="215">J</text>
    <text x="14" y="193">1</text><text x="14" y="173">2</text>
    <text x="14" y="153">3</text><text x="14" y="133">4</text>
    <text x="14" y="113">5</text><text x="14" y="93">6</text>
    <text x="14" y="73">7</text><text x="14" y="53">8</text>
    <text x="14" y="33">9</text>
  </g>
</svg>
