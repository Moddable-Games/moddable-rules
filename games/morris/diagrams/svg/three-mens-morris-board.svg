<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <title>Three Men's Morris board</title>

  <!-- Background -->
  <rect x="0" y="0" width="320" height="320" fill="#f5e6c8" rx="4"/>

  <!-- 3x3 grid -->
  <g fill="none" stroke="#4a3520" stroke-width="2.5" stroke-linecap="square">
    <!-- Outer border -->
    <rect x="40" y="40" width="240" height="240"/>
    <!-- Vertical lines -->
    <line x1="160" y1="40" x2="160" y2="280"/>
    <!-- Horizontal lines -->
    <line x1="40" y1="160" x2="280" y2="160"/>
    <!-- Diagonals -->
    <line x1="40" y1="40" x2="280" y2="280"/>
    <line x1="280" y1="40" x2="40" y2="280"/>
  </g>

  <!-- Intersection points (9 total) -->
  <g fill="#4a3520">
    <!-- Top row -->
    <circle cx="40" cy="40" r="7"/>
    <circle cx="160" cy="40" r="7"/>
    <circle cx="280" cy="40" r="7"/>
    <!-- Middle row -->
    <circle cx="40" cy="160" r="7"/>
    <circle cx="160" cy="160" r="7"/>
    <circle cx="280" cy="160" r="7"/>
    <!-- Bottom row -->
    <circle cx="40" cy="280" r="7"/>
    <circle cx="160" cy="280" r="7"/>
    <circle cx="280" cy="280" r="7"/>
  </g>
</svg>
