<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <title>Six Men's Morris board</title>

  <!-- Background -->
  <rect x="0" y="0" width="320" height="320" fill="#f5e6c8" rx="4"/>

  <!-- Two concentric squares -->
  <g fill="none" stroke="#4a3520" stroke-width="2.5" stroke-linecap="square">
    <!-- Outer square -->
    <rect x="40" y="40" width="240" height="240"/>
    <!-- Inner square -->
    <rect x="100" y="100" width="120" height="120"/>

    <!-- Midpoint connections between rings -->
    <!-- Top midpoints -->
    <line x1="160" y1="40" x2="160" y2="100"/>
    <!-- Bottom midpoints -->
    <line x1="160" y1="220" x2="160" y2="280"/>
    <!-- Left midpoints -->
    <line x1="40" y1="160" x2="100" y2="160"/>
    <!-- Right midpoints -->
    <line x1="220" y1="160" x2="280" y2="160"/>
  </g>

  <!-- Intersection points (16 total) -->
  <g fill="#4a3520">
    <!-- Outer square corners and midpoints -->
    <circle cx="40" cy="40" r="7"/>
    <circle cx="160" cy="40" r="7"/>
    <circle cx="280" cy="40" r="7"/>
    <circle cx="280" cy="160" r="7"/>
    <circle cx="280" cy="280" r="7"/>
    <circle cx="160" cy="280" r="7"/>
    <circle cx="40" cy="280" r="7"/>
    <circle cx="40" cy="160" r="7"/>

    <!-- Inner square corners and midpoints -->
    <circle cx="100" cy="100" r="7"/>
    <circle cx="160" cy="100" r="7"/>
    <circle cx="220" cy="100" r="7"/>
    <circle cx="220" cy="160" r="7"/>
    <circle cx="220" cy="220" r="7"/>
    <circle cx="160" cy="220" r="7"/>
    <circle cx="100" cy="220" r="7"/>
    <circle cx="100" cy="160" r="7"/>
  </g>
</svg>
