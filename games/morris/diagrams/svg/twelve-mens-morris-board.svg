<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <title>Twelve Men's Morris board</title>

  <!-- Background -->
  <rect x="0" y="0" width="320" height="320" fill="#f5e6c8" rx="4"/>

  <!-- Three concentric squares with midpoint and diagonal connections -->
  <g fill="none" stroke="#4a3520" stroke-width="2.5" stroke-linecap="square">
    <!-- Outer square -->
    <rect x="20" y="20" width="280" height="280"/>
    <!-- Middle square -->
    <rect x="70" y="70" width="180" height="180"/>
    <!-- Inner square -->
    <rect x="120" y="120" width="80" height="80"/>

    <!-- Midpoint connections between rings -->
    <line x1="160" y1="20" x2="160" y2="120"/>
    <line x1="160" y1="200" x2="160" y2="300"/>
    <line x1="20" y1="160" x2="120" y2="160"/>
    <line x1="200" y1="160" x2="300" y2="160"/>

    <!-- Diagonal connections (corners of adjacent squares) -->
    <!-- Top-left diagonal -->
    <line x1="20" y1="20" x2="120" y2="120"/>
    <!-- Top-right diagonal -->
    <line x1="300" y1="20" x2="200" y2="120"/>
    <!-- Bottom-left diagonal -->
    <line x1="20" y1="300" x2="120" y2="200"/>
    <!-- Bottom-right diagonal -->
    <line x1="300" y1="300" x2="200" y2="200"/>
  </g>

  <!-- Intersection points (24 total) -->
  <g fill="#4a3520">
    <!-- Outer square corners and midpoints -->
    <circle cx="20" cy="20" r="7"/>
    <circle cx="160" cy="20" r="7"/>
    <circle cx="300" cy="20" r="7"/>
    <circle cx="300" cy="160" r="7"/>
    <circle cx="300" cy="300" r="7"/>
    <circle cx="160" cy="300" r="7"/>
    <circle cx="20" cy="300" r="7"/>
    <circle cx="20" cy="160" r="7"/>

    <!-- Middle square corners and midpoints -->
    <circle cx="70" cy="70" r="7"/>
    <circle cx="160" cy="70" r="7"/>
    <circle cx="250" cy="70" r="7"/>
    <circle cx="250" cy="160" r="7"/>
    <circle cx="250" cy="250" r="7"/>
    <circle cx="160" cy="250" r="7"/>
    <circle cx="70" cy="250" r="7"/>
    <circle cx="70" cy="160" r="7"/>

    <!-- Inner square corners and midpoints -->
    <circle cx="120" cy="120" r="7"/>
    <circle cx="160" cy="120" r="7"/>
    <circle cx="200" cy="120" r="7"/>
    <circle cx="200" cy="160" r="7"/>
    <circle cx="200" cy="200" r="7"/>
    <circle cx="160" cy="200" r="7"/>
    <circle cx="120" cy="200" r="7"/>
    <circle cx="120" cy="160" r="7"/>
  </g>
</svg>
