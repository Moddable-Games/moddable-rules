<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{game_title}} — {{cover_sub}} v{{version}}</title>
<meta name="description" content="{{tagline}}">
<meta property="og:title" content="{{game_title}} — {{cover_sub}} v{{version}}">
<meta property="og:description" content="{{tagline}}">
<meta property="og:image" content="https://rules.moddable.games/games/{{slug}}/og-image.png?v={{project_version}}">
<meta property="og:url" content="https://rules.moddable.games/dist/{{slug}}/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Moddable Rules">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{game_title}} — {{cover_sub}} v{{version}}">
<meta name="twitter:description" content="{{tagline}}">
<meta name="twitter:image" content="https://rules.moddable.games/games/{{slug}}/og-image.png?v={{project_version}}">
<link rel="icon" type="image/svg+xml" href="../../shared/logos/favicon.svg">
<link rel="stylesheet" href="../../shared/css/fonts.css?v={{version}}">
<link rel="stylesheet" href="../../shared/css/tokens.css?v={{version}}">
<link rel="stylesheet" href="../../shared/css/base.css?v={{version}}">
<link rel="stylesheet" href="../../shared/css/components.css?v={{version}}">
<link rel="stylesheet" href="../../games/{{slug}}/theme.css?v={{version}}">
<script type="module" src="../../shared/js/analytics.js"></script>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to content</a>
<div class="page">

<header class="doc-header" role="banner">
  <div class="hdr-brand"><a href="../../index.html"><img src="../../shared/logos/moddable-white.png" alt="Moddable Games"></a></div>
  <div class="hdr-links">
    <a href="../../index.html" class="hdr-link">All Rules</a>
    <a href="../../games/{{slug}}/content/rulebook.md" class="hdr-link">Markdown</a>
    {{PDF_LINK}}
    <button class="surface-toggle hdr-link" aria-label="Toggle light/dark mode" type="button">◐</button>
  </div>
  <span class="hdr-meta">{{cover_sub}} &middot; v{{version}}</span>
</header>

<div class="cover">
  {{COVER_LOGO}}
  <div class="cover-title {{cover_title_class}}">{{game_title}}</div>
  <div class="cover-sub">{{cover_sub}}</div>
  <div class="cover-rule"></div>
  <p class="cover-tagline">{{tagline}}</p>
  <div class="cover-stats">
    {{COVER_STATS}}
  </div>
  <p class="cover-pub">Published by Moddable Games &middot; v{{version}}</p>
</div>

<nav class="toc" id="toc" aria-label="Table of contents"></nav>

<main id="main-content" class="content">

{{CONTENT}}

</main>

<footer class="doc-footer" role="contentinfo">
  <span class="ftr-copy">{{game_title}} v{{version}} · Published by Moddable Games · © 2026 All Rights Reserved</span>
</footer>

</div>

<script type="module" src="../../js/toc.js?v={{version}}"></script>
<script type="module" src="../../shared/js/surface-toggle.js"></script>
</body>
</html>
