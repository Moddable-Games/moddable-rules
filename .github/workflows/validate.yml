name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate FEN/setup strings
        run: node scripts/check-fen.mjs

      - name: Check attribution
        run: node scripts/check-attribution.mjs
