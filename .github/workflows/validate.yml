name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate FEN/setup strings
        run: node scripts/check-fen.mjs

      - name: Check attribution
        run: node scripts/check-attribution.mjs

      - run: npm ci --ignore-scripts

      - name: Build (for stats check)
        run: npm run build

      - name: Check stats freshness
        run: node scripts/check-stats.mjs

      - name: Check diagram freshness
        run: node scripts/check-diagram-freshness.mjs
