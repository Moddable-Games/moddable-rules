name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate FEN/setup strings
        run: node scripts/check-fen.mjs

      - name: Check attribution
        run: node scripts/check-attribution.mjs

      # A count is the cheapest fact about a starting position. Dai Shogi's
      # file stated 65 pieces per side while its setup held 63, four lines
      # apart, for eight weeks.
      - name: Check setup piece counts
        run: node scripts/check-piece-counts.mjs

      - run: npm ci --ignore-scripts

      - name: Build (for stats check)
        run: npm run build

      - name: Check stats freshness
        run: node scripts/check-stats.mjs

      - name: Check diagram freshness
        run: node scripts/check-diagram-freshness.mjs

      # Every PDF was last built 2026-08-07 while thirteen families changed
      # their variants underneath, so 666 of them described a corpus that had
      # moved on. Nothing regenerated them and nothing checked them.
      - name: Check PDF freshness
        run: node scripts/check-pdf-freshness.mjs
