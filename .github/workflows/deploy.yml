name: Build and Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate FEN/setup strings
        run: node scripts/check-fen.mjs

      - run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          cp CNAME _site/ 2>/dev/null || true
          cp diagrams-manifest.json _site/
          cp -r dist _site/
          cp -r shared _site/
          cp -r js _site/
          cp -r css _site/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          cname: rules.moddable.games
