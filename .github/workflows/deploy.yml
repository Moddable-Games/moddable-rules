name: Build and Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate FEN/setup strings
        run: node scripts/check-fen.mjs

      - run: npm run build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp .nojekyll _site/
          cp CNAME _site/ 2>/dev/null || true
          cp diagrams-manifest.json _site/
          cp -r diagrams _site/
          cp -r dist _site/
          cp -r shared _site/
          rsync -a --exclude='pdf/' games/ _site/games/
          cp -r js _site/
          cp -r css _site/
          # Serve API at /api/ (not just /dist/api/)
          mkdir -p _site/api
          cp -r api/* _site/api/ 2>/dev/null || true
          cp -r dist/api/* _site/api/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
