name: Build and Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Validate FEN/setup strings
        run: node scripts/check-fen.mjs

      - run: npm run build

      # Same script local dev runs, so the tree that deploys is the tree that
      # was tested. Inlined here, it could not be run locally at all, and the
      # diagrams gallery's Rules links resolved only after deployment.
      - name: Assemble site
        run: ./scripts/assemble-site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
